
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coding Conf - Your Ticket</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <img src="logo-full.svg" alt="Coding Conf logo">
    </header>

    <main>

        <section class="ticket-section">

            <h1>
                Congrats, <span id="ticketName"></span>!
            </h1>

            <p class="description">
                Your ticket is ready. We can't wait to see you at Coding Conf 2026!
            </p>

            <div class="ticket-card">

                <div class="ticket-header">
                    <img src="logo-full.svg" alt="Coding Conf logo">

                    <p>October 26, 2026 | Papine, Kgn</p>
                </div>

                <div class="ticket-attendee">

                    <img id="ticketAvatar" src="" alt="Attendee avatar">

                    <div>
                        <h2 id="attendeeName"></h2>
                        <p>
                            <a id="attendeeGithub" href="#" target="_blank">
                            </a>
                        </p>
                    </div>

                </div>

                <div class="ticket-number">
                    <p id="ticketNumber"></p>
                </div>

            </div>

        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Coding Conf. All Rights Reserved.</p>
    </footer>

    <script src="ticket.js"></script>

</body>
</html>
